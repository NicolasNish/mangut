<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Receita - Mangut</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo-link">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Mangut" class="navbar-logo">
        </a>
        <nav class="nav-links">
            <a href="/">← Cancelar e Voltar</a>
        </nav>
        <div class="nav-actions">
            {% if current_user.is_authenticated %}
                <a href="/logout" class="btn-logout" title="Sair do sistema">🚪 Sair</a>
            {% endif %}
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h1>➕ Cadastrar Nova Receita</h1>
            <p class="form-subtext">Compartilhe um prato típico ou iguaria com a comunidade Mangut.</p>

            <!-- enctype="multipart/form-data" é obrigatório para envio de arquivos -->
            <form action="/receita/nova" method="POST" enctype="multipart/form-data" class="recipe-form">
                <div class="form-group">
                    <label for="nome">Nome da Receita:</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Caldeirada de Filhote" required>
                </div>

                <div class="form-group">
                    <label for="categoria_id">Categoria:</label>
                    <select id="categoria_id" name="categoria_id" required>
                        <option value="" disabled selected>Selecione uma categoria...</option>
                        {% for cat in categorias %}
                            <option value="{{ cat.idcategoria }}">{{ cat.nome }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Campo de Upload do Computador -->
                <div class="form-group">
                    <label for="imagem_arquivo">🖼️ Enviar Foto do Computador:</label>
                    <input type="file" id="imagem_arquivo" name="imagem_arquivo" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="imagem_url">Ou Cole o Link de uma Imagem (URL):</label>
                    <input type="url" id="imagem_url" name="imagem_url" placeholder="https://exemplo.com/imagem.jpg">
                </div>

                <div class="form-group">
                    <label for="descricao">Breve Descrição:</label>
                    <textarea id="descricao" name="descricao" rows="2" placeholder="Resumo do prato, origem ou acompanhamento ideal..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="lista_ingredientes">Ingredientes (separados por vírgula):</label>
                    <textarea id="lista_ingredientes" name="lista_ingredientes" rows="3" placeholder="Ex: 1kg de filhote em postas, 2 tucupis, folhas de jambu, pimenta-de-cheiro" required></textarea>
                </div>

                <div class="form-group">
                    <label for="modo_preparo">Modo de Preparo:</label>
                    <textarea id="modo_preparo" name="modo_preparo" rows="5" placeholder="Descreva o passo a passo detalhado..." required></textarea>
                </div>

                <button type="submit" class="btn-primary btn-submit">Publicar Receita</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mangut. Todos os direitos reservados.</p>
    </footer>

    <button id="theme-toggle" class="theme-toggle-floating" title="Alternar Modo Escuro">🌙</button>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
