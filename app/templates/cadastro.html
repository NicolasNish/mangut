<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta - Mangut</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/png">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo-link">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Mangut" class="navbar-logo">
        </a>
    </header>

    <main class="container">
        <section class="form-section">
            <h1>Criar Conta</h1>
            <p class="form-subtext">Cadastre-se para publicar suas próprias receitas.</p>

            <form action="/cadastro" method="POST" class="recipe-form">
                <!-- Preserva a página de retorno -->
                {% if next %}
                <input type="hidden" name="next" value="{{ next }}">
                {% endif %}

                <div class="form-group">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" name="nome" placeholder="Seu nome" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite uma senha segura" required>
                </div>

                <button type="submit" class="btn-primary btn-submit">Cadastrar</button>
            </form>
            <p style="margin-top: 1.5rem; color: var(--text-secondary);">Já possui conta? <a href="/login{% if next %}?next={{ next }}{% endif %}" style="color: var(--text-accent); font-weight: 600;">Faça login aqui</a>..</p>
        </section>
    </main>
</body>
</html>
