<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar {{ receita.nome }} - Mangut</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/logo.png') }}" type="image/png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <a href="/" class="logo-link">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo Mangut" class="navbar-logo">
        </a>
        <nav class="nav-links">
            <a href="/receita/{{ receita.id }}">← Voltar para a Receita</a>
        </nav>
        <div class="nav-actions">
            {% if current_user.is_authenticated %}
                <a href="/logout" class="btn-logout" title="Sair do sistema">🚪 Sair</a>
            {% endif %}
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h1>✏️ Editar Receita</h1>
            <p class="form-subtext">Atualize as informações da sua receita.</p>

            <form action="/receita/{{ receita.id }}/editar" method="POST" enctype="multipart/form-data" class="recipe-form">
                <div class="form-group">
                    <label for="nome">Nome do Prato:</label>
                    <input type="text" id="nome" name="nome" value="{{ receita.nome }}" required>
                </div>

                <div class="form-group">
                    <label for="categoria_id">Categoria:</label>
                    <select id="categoria_id" name="categoria_id" required>
                        {% for cat in categorias %}
                        <option value="{{ cat.idcategoria }}" {% if cat.idcategoria == receita.categoria_id %}selected{% endif %}>
                            {{ cat.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="imagem_arquivo">📸 Atualizar Foto (do computador):</label>
                    <input type="file" id="imagem_arquivo" name="imagem_arquivo" accept="image/*">
                    <span class="input-hint">Deixe em branco para manter a imagem atual.</span>
                </div>

                <div class="form-group">
                    <label for="descricao">Breve Apresentação do Prato:</label>
                    <textarea id="descricao" name="descricao" rows="3" required>{{ receita.descricao }}</textarea>
                </div>

                <div class="form-group">
                    <label for="lista_ingredientes">Ingredientes e Quantidades (Um por linha):</label>
                    <textarea id="lista_ingredientes" name="lista_ingredientes" rows="6" required>{{ receita.lista_ingredientes }}</textarea>
                    <span class="input-hint">Mantenha cada ingrediente com sua medida em uma linha separada.</span>
                </div>

                <div class="form-group">
                    <label for="modo_preparo">Modo de Preparo:</label>
                    <textarea id="modo_preparo" name="modo_preparo" rows="7" required>{{ receita.modo_preparo }}</textarea>
                </div>

                <button type="submit" class="btn-primary btn-submit">Salvar Alterações</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mangut. Culinária e tradição do Norte.</p>
    </footer>

    <button id="theme-toggle" class="theme-toggle-floating" title="Alternar Modo Escuro">🌙</button>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
