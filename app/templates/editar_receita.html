<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar {{ receita.nome }} - Mangut</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Header / Navbar -->
    <header class="navbar">
        <a href="/" class="logo">mangut</a>
        <nav class="nav-links">
            <a href="/receita/{{ receita.id }}">← Voltar para a Receita</a>
        </nav>
        <div class="nav-actions">
            <button id="theme-toggle" class="theme-toggle" title="Alternar Modo Escuro">🌙</button>
        </div>
    </header>

    <main class="container">
        <section class="form-section">
            <h1>✏️ Editar Receita</h1>
            <p class="form-subtext">Ajuste os dados da receita abaixo para atualizar o banco de dados.</p>

            <form action="/receita/{{ receita.id }}/editar" method="POST" class="recipe-form">

                <div class="form-group">
                    <label for="nome">Nome da Receita:</label>
                    <input type="text" id="nome" name="nome" value="{{ receita.nome }}" required>
                </div>

                <div class="form-group">
                    <label for="categoria_id">Categoria:</label>
                    <select id="categoria_id" name="categoria_id" required>
                        {% for cat in categorias %}
                        <option value="{{ cat.idcategoria }}" {% if cat.idcategoria == receita.categoria_id %}selected{% endif %}>
                            {{ cat.nome }}
                        </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="descricao">Breve Descrição:</label>
                    <input type="text" id="descricao" name="descricao" value="{{ receita.descricao }}" required>
                </div>

                <div class="form-group">
                    <label for="imagem_url">URL da Imagem (Link da Web):</label>
                    <input type="url" id="imagem_url" name="imagem_url" value="{{ receita.imagem_url or '' }}">
                </div>

                <div class="form-group">
                    <label for="lista_ingredientes">Ingredientes (separados por vírgula):</label>
                    <textarea id="lista_ingredientes" name="lista_ingredientes" rows="3" required>{{ receita.lista_ingredientes }}</textarea>
                </div>

                <div class="form-group">
                    <label for="modo_preparo">Modo de Preparo:</label>
                    <textarea id="modo_preparo" name="modo_preparo" rows="5" required>{{ receita.modo_preparo }}</textarea>
                </div>

                <button type="submit" class="btn-primary btn-submit">Salvar Alterações</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Mangut. Todos os direitos reservados.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
